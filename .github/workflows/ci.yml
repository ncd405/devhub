name: CI
on:
  push:
    branches: [main]
    paths: ["notebooks/**"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Colab -> GitHub: notebook trong /notebooks tự thành bài blog
      - name: Convert notebooks to posts
        run: python scripts/ipynb_to_md.py
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci || npm install
      - name: Build check (bắt lỗi trước khi deploy)
        run: npm run build
      - name: Commit generated posts
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/blog
          git diff --cached --quiet || (git commit -m "chore: sync notebooks to blog" && git push)
